<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathalie Bezerra | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --dourado-primario: #b8977e;
            --dourado-suave: #e5d3c5;
            --fundo-premium: #fdfcfb;
            --texto-titulo: #3d342d;
            --texto-corpo: #6b5f56;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--fundo-premium);
            background-image: url('https://www.transparenttextures.com/patterns/white-marble.png');
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; text-align: center; color: var(--texto-corpo);
        }

        .container { padding: 40px 20px; width: 100%; max-width: 400px; box-sizing: border-box; }

        .logo-area { margin-bottom: 35px; animation: fadeIn 1.2s ease-out; }

        .img-logo {
            width: 180px; height: 180px;
            object-fit: cover; border-radius: 50%; /* Logo redonda fica mais moderna em links */
            margin: 0 auto 15px auto; display: block;
            border: 3px solid var(--dourado-suave);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .logo-area h1 {
            font-family: 'Playfair Display', serif; font-size: 1.6rem;
            color: var(--texto-titulo); margin: 0; letter-spacing: 1px;
        }

        .logo-area p {
            text-transform: uppercase; letter-spacing: 4px; font-size: 0.65rem;
            color: var(--dourado-primario); margin: 8px 0; font-weight: 600;
        }

        .links-area { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .btn-link {
            background: #ffffff; color: var(--texto-titulo); text-decoration: none;
            padding: 18px; border-radius: 50px; /* Bordas arredondadas são padrão em Linktrees */
            font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.3s ease; border: 1px solid var(--dourado-suave);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-link i { font-size: 1.1rem; color: var(--dourado-primario); }

        .btn-link:hover {
            transform: scale(1.02);
            background: var(--dourado-primario); color: #fff;
            border-color: var(--dourado-primario);
        }
        
        .btn-link:hover i { color: #fff; }

        /* Destaque para o WhatsApp */
        .btn-destaque {
            border: 2px solid var(--dourado-primario);
            position: relative;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(184, 151, 126, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(184, 151, 126, 0); }
            100% { box-shadow: 0 0 0 0 rgba(184, 151, 126, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer { margin-top: auto; padding: 25px; font-size: 0.6rem; color: var(--dourado-primario); opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <img src="logo.jpg" alt="Nathalie Bezerra" class="img-logo">
            <h1>Nathalie Bezerra</h1>
            <p>Estética e Bem-Estar</p>
        </div>
